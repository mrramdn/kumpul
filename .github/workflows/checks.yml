name: Checks

# Setiap push ke main dan setiap pull request: cek kode, lalu jalankan seluruh stack dengan Docker Compose
# seperti di laptop, uji API-nya, dan pastikan data tetap ada setelah container dibuat ulang.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint dan typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  stack:
    name: Docker Compose dan uji API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Siapkan .env dari contoh
        run: cp .env.example .env
      - name: Bangun image dan jalankan stack
        run: docker compose up -d --build --wait
      - name: Uji API
        run: docker compose --profile test run --rm uji
      - name: Uji persistensi (acara dan sesi login tetap ada setelah docker compose down dan up)
        run: |
          set -euo pipefail
          base=http://localhost:3000
          curl -sf -c cookie.txt -X POST "$base/api/users" -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.test","password":"rahasia-ci-123"}' > /dev/null
          id=$(curl -sf -b cookie.txt -X POST "$base/api/events" -H 'Content-Type: application/json' \
            -d '{"title":"Uji persistensi","host":"CI","location":"GitHub Actions","startsAt":"2030-01-01T09:00","endsAt":"2030-01-01T10:00"}' \
            | jq -r '.data.id')
          docker compose down
          docker compose up -d --wait
          curl -sf "$base/api/events/$id" | jq -e '.data.title == "Uji persistensi"'
          curl -sf -b cookie.txt "$base/api/session" | jq -e '.data.user.email == "ci@example.test"'
      - name: Log container
        if: failure()
        run: docker compose logs --no-color
      - name: Bersihkan
        if: always()
        run: docker compose down -v
